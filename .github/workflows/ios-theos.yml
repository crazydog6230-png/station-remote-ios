name: ios-theos

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build (with log)
        run: |
          exec > >(tee -a build.log) 2>&1
          set -x
          export THEOS="$GITHUB_WORKSPACE/theos-toolchain"
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip git wget \
            libxml2 libncurses6 libtinfo6 libz3-dev libplist-utils

          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS" || true

          mkdir -p "$THEOS/toolchain"
          if [ ! -d "$THEOS/toolchain/linux" ]; then
            wget -q https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu22.04.tar.xz -O /tmp/swift.tar.xz
            tar -xf /tmp/swift.tar.xz -C "$THEOS/toolchain"
          fi

          mkdir -p "$THEOS/sdks"
          if [ ! -d "$THEOS/sdks/iPhoneOS9.3.sdk" ]; then
            cd "$THEOS/sdks"
            wget -q https://github.com/theos/sdks/archive/master.tar.gz
            tar -xzf master.tar.gz
            mv sdks-master/*.sdk .
            rm -rf sdks-master master.tar.gz
            cd "$GITHUB_WORKSPACE"
          fi

          ls "$THEOS/sdks" | head -n 20
          ls "$THEOS/toolchain" | head -n 20

          cd theos
          make stage
          find .theos -maxdepth 5 -name "*.app" -print

      - name: Package IPA
        run: |
          exec >> build.log 2>&1
          set -x
          APP=$(find theos/.theos/_ -maxdepth 5 -name "StationRemote.app" | head -n1)
          echo "app: $APP"
          test -n "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -r StationRemote.ipa Payload
          ls -lh StationRemote.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StationRemote-ios9-theos
          path: build/StationRemote.ipa
          if-no-files-found: error

      - name: Annotate errors
        if: failure()
        run: |
          echo "::error::BUILD FAILED"
          grep -n "error:" build.log | head -n 12 | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Publish build log
        if: always()
        run: |
          echo "=== build.log ==="
          tail -n 200 build.log || true
          git config user.name "ci"
          git config user.email "ci@local"
          cp build.log ci-build.log || true
          git add ci-build.log || true
          git commit -m "ci build log [skip ci]" || true
          git push || true
