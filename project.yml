name: StationRemote
options:
  bundleIdPrefix: ru.dsh
  deploymentTarget:
    iOS: "9.0"
settings:
  base:
    ONLY_ACTIVE_ARCH: NO
    ENABLE_BITCODE: NO
targets:
  StationRemote:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
      - path: Resources
    dependencies:
      - sdk: WebKit.framework
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: ru.dsh.stationremote
        PRODUCT_NAME: StationRemote
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: "armv7 arm64"
        VALID_ARCHS: "armv7 armv7s arm64"
        IPHONEOS_DEPLOYMENT_TARGET: "9.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
